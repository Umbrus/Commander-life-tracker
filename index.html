<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Commander Pod Tracker</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

  <div class="card">
    <div id="statusBox" class="status">Connecting to Firebase...</div>

    <!-- LOBBY SCREEN -->
    <div id="lobbyView" class="hidden">
      <h1>Commander Pod Tracker</h1>
      <input id="playerNameInput" type="text" placeholder="Your Name (e.g. Nathan)" />

      <div id="standardCreateSection">
        <button id="createPodBtn" class="btn-primary">Create New Pod</button>
        <hr style="border-color:#2a2f3a; margin: 16px 0;">
      </div>

      <input id="roomCodeInput" type="text" maxlength="4" placeholder="4-Letter Code (e.g. SOL9)" style="text-transform:uppercase;" />
      <button id="joinPodBtn" class="btn-secondary">Join Existing Pod</button>
    </div>

    <!-- ACTIVE TABLE SCREEN -->
    <div id="podView" class="hidden">
      <div class="pod-header">
        <div class="pod-badge">POD: <span id="displayRoomCode">----</span></div>
        <div class="header-actions">
          <button id="toggleQrBtn" class="btn-secondary btn-small">Hide QR</button>
        </div>
      </div>

      <!-- Collapsible QR Invite Drawer -->
      <div id="qrDrawer" class="qr-drawer">
        <div id="qrBox" class="qr-wrapper"></div>
        <div class="invite-hint">Scan to join • Tap "Hide QR" once everyone is in</div>
        <button id="copyLinkBtn" class="btn-secondary btn-small">Copy Link</button>
      </div>

      <!-- Live Opponents Row -->
      <div id="opponentsGrid" class="opponents-grid"></div>

      <!-- Your Hero Life Counter -->
      <div class="hero-tracker">
        <div id="heroPlayerName" class="hero-label">You</div>
        <div id="heroLifeDisplay" class="hero-life-display">40</div>
        <div id="deltaBadge" class="delta-badge"></div>

        <div class="tap-zones">
          <div id="minusZone" class="tap-zone left">−</div>
          <div id="plusZone" class="tap-zone right">+</div>
        </div>
      </div>

      <div id="wakeStatus" class="wake-status">Screen Wake Lock: Checking...</div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
